{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-body text-center">

{% if user.avatar %}

<img src="{{ user.avatar.url }}"
width="140"
height="140"
class="rounded-circle">

{% endif %}

<h3 class="mt-3">

{{ user.username }}

</h3>

<p>

{{ user.email }}

</p>

<p>

{{ user.phone }}

</p>

<a
href="{% url 'edit_profile' %}"
class="btn btn-success">

Edit Profile

</a>

</div>

</div>

</div>

{% endblock %}
