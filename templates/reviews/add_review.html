{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">

            <h4>

                Review Produk

            </h4>

        </div>

        <div class="card-body">

            <h5>

                {{ rental_item.product.name }}

            </h5>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    class="btn btn-success">

                    Simpan Review

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
