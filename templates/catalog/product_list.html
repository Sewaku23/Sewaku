{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        🏕 Semua Produk
    </h2>

    <div class="row">

        {% for product in products %}

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow-sm">

                {% if product.image %}

                <img src="{{ product.image.url }}"
                     class="card-img-top"
                     style="height:250px; object-fit:cover;">

                {% endif %}

                <div class="card-body">

                    <h5>

                        {{ product.name }}

                    </h5>

                    <p class="text-muted">

                        {{ product.category }}

                    </p>

                    <p>

                        Rp {{ product.price_per_day }}

                    </p>

                    <p>

                        Stock :
                        {{ product.stock }}

                    </p>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="col-12">

            <div class="alert alert-warning">

                Belum ada produk.

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
